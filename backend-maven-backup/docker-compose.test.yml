# NextERP 测试环境 Docker Compose 配置
version: '3.8'

services:
  # PostgreSQL 测试数据库
  postgres-test:
    image: postgres:16-alpine
    container_name: nexterp-postgres-test
    environment:
      POSTGRES_DB: nexterp_test
      POSTGRES_USER: nexterp_test
      POSTGRES_PASSWORD: nexterp_test_password
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexterp_test"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexterp-test-network

  # Redis 测试缓存
  redis-test:
    image: redis:7-alpine
    container_name: nexterp-redis-test
    ports:
      - "6380:6379"
    command: redis-server --requirepass nexterp_test_password
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "nexterp_test_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexterp-test-network

  # RabbitMQ 测试消息队列
  rabbitmq-test:
    image: rabbitmq:3-management-alpine
    container_name: nexterp-rabbitmq-test
    environment:
      RABBITMQ_DEFAULT_USER: nexterp_test
      RABBITMQ_DEFAULT_PASS: nexterp_test_password
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nexterp-test-network

volumes:
  postgres_test_data:

networks:
  nexterp-test-network:
    driver: bridge
