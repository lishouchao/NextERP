server:
  port: 8080
spring:
  application:
    name: nexterp-platform-auth
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000ms
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:nexterp;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: null
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        use_sql_comments: true
    open-in-view: false
  liquibase:
    enabled: false
  task:
    scheduling:
      pool:
        size: 5
jwt:
  secret: dev-secret-key-for-testing-only-change-in-production
  expiration: 7200
  refresh-expiration: 604800
  token-prefix: 'Bearer '
  header: Authorization
logging:
  level:
    root: INFO
    com.nexterp: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n'
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
