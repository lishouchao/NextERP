# NextERP 测试环境配置 - H2 内存数据库
spring:
  application:
    name: nexterp-test

  # H2 内存数据库配置
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000

  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
        default_schema: public
    open-in-view: false

  # H2 控制台（可选，用于调试）
  h2:
    console:
      enabled: true
      path: /h2-console

  # 禁用 Redis 测试环境
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 1000
      lettuce:
        pool:
          max-active: 0

  # 禁用 RabbitMQ 测试环境
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

# JWT 配置
jwt:
  secret: test-secret-key-for-jwt-token-generation-minimum-256-bits-for-testing-only
  expiration: 3600000
  refresh-expiration: 7200000

# 日志配置
logging:
  level:
    root: INFO
    com.nexterp: DEBUG
    org.springframework.test: DEBUG
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# 多租户配置
tenant:
  default-id: 0
  header-name: X-Tenant-ID
  isolation-enabled: true

# 文件上传配置
file:
  upload:
    path: /tmp/nexterp-test/uploads
    max-size: 10MB

# 报表配置
report:
  export:
    path: /tmp/nexterp-test/reports

# 工作流配置
workflow:
  enable: false  # 测试环境禁用工作流
