# NextERP 测试环境配置
spring:
  application:
    name: nexterp-test

  # 数据源配置
  datasource:
    url: jdbc:postgresql://localhost:5433/nexterp_test
    username: nexterp_test
    password: nexterp_test_password
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 30000

  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false

  # Liquibase 配置
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/changelog-master.xml
    contexts: test

  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6380
      password: nexterp_test_password
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2

  # RabbitMQ 配置
  rabbitmq:
    host: localhost
    port: 5673
    username: nexterp_test
    password: nexterp_test_password

# JWT 配置
jwt:
  secret: test-secret-key-for-jwt-token-generation-minimum-256-bits
  expiration: 3600000  # 1小时
  refresh-expiration: 7200000  # 2小时

# 日志配置
logging:
  level:
    root: INFO
    com.nexterp: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

# 多租户配置
tenant:
  default-id: 0
  header-name: X-Tenant-ID
  isolation-enabled: true

# 文件上传配置
file:
  upload:
    path: /tmp/nexterp-test/uploads
    max-size: 10MB

# 报表配置
report:
  export:
    path: /tmp/nexterp-test/reports

# 工作流配置
workflow:
  enable: true
