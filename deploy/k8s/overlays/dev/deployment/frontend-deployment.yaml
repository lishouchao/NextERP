apiVersion: apps/v1
kind: Deployment
metadata:
  name: nexterp-frontend
  namespace: nexterp
  labels:
    app: nexterp-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nexterp-frontend
  template:
    metadata:
      labels:
        app: nexterp-frontend
    spec:
      containers:
        - name: frontend
          image: nexterp/frontend:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://nexterp-backend.nexterp.svc.cluster.local:8080"
            - name: NODE_ENV
              value: "production"
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
